---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data-pv
  # namespace: monitoring
spec:
  capacity:
    storage: 300Mi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /k8s/data/grafana/grafana-data
    server: 172.16.7.99


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 280Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-configmap-timezone
  namespace: monitoring
data:
  TZ: "Asia/Dhaka"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-configmap-credentials
  namespace: monitoring
data:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
  GF_USERS_ALLOW_SIGN_UP: "false"


---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: grafana-ui
          envFrom:
            - configMapRef:
                name: grafana-configmap-timezone
            - configMapRef:
                name: grafana-configmap-credentials
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data-pvc


---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: grafana-web
      port: 3000
      targetPort: 3000
      protocol: TCP
      nodePort: 30091