---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring


---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-data-pv
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /k8s/data/alertmanager/alertmanager-data
    server: 172.16.7.99


---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-config-pv
  # namespace: monitoring
spec:
  capacity:
    storage: 15Mi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /k8s/data/alertmanager/alertmanager-config
    server: 172.16.7.99

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 480Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-config-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 12Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-configmap
  namespace: monitoring
data:
  TZ: "Asia/Dhaka"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:main
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
              name: alertmanager-ui
          envFrom:
            - configMapRef:
                name: alertmanager-configmap
          volumeMounts:
            - name: alertmanager-data
              mountPath: /alertmanager
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
      volumes:
        - name: alertmanager-data
          persistentVolumeClaim:
            claimName: alertmanager-data-pvc
        - name: alertmanager-config
          persistentVolumeClaim:
            claimName: alertmanager-config-pvc


---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-svc
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - name: alertmanager-web
      port: 9093
      targetPort: 9093
      protocol: TCP
      nodePort: 30092